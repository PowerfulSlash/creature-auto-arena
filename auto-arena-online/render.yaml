# Render blueprint. A persistent disk is required so accounts and ratings survive redeploys
# (disks need a paid instance type). Without a disk everything resets on each deploy.
services:
  - type: web
    name: creature-auto-arena
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: arena-data
      mountPath: /data
      sizeGB: 1
